name: CI

on:
  pull_request:

permissions:
  contents: read

# A pull request only needs its newest push verified.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The run finishes in about four minutes. Anything near this ceiling is hung, and without
    # it a stuck Playwright holds a runner for the six-hour default.
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
      TURBOWARP_KAMISHIBAI_APP_ROOT: ${{ github.workspace }}/.tmp/turbowarp-kamishibai-app
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify
