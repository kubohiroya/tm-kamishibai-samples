name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      TM_KAMISHIBAI_DSL4_ROOT: ${{ github.workspace }}/.tmp/tm-kamishibai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kubohiroya/tm-kamishibai
          ref: 76d9c4085d0564467476734d540c00926692bb4c
          path: .tmp/tm-kamishibai
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .tmp/tm-kamishibai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: .tmp/tm-kamishibai
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run check
