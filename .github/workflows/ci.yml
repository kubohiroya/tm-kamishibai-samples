name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      TMPOSE_KAMISHIBAI_DSL4_ROOT: ${{ github.workspace }}/.tmp/tmpose-kamishibai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kubohiroya/tmpose-kamishibai
          ref: 9fdea59854ff0a28a00a45fe8e1d7cd5bb0c9014
          path: .tmp/tmpose-kamishibai
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .tmp/tmpose-kamishibai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: .tmp/tmpose-kamishibai
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:web
      - run: pnpm verify
