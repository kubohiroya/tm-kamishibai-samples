name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    env:
      TZ: Asia/Tokyo
      TMPOSE_KAMISHIBAI_DSL4_ROOT: ${{ github.workspace }}/.tmp/tmpose-kamishibai
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: kubohiroya/tmpose-kamishibai
          ref: 4c360cd9845f9dcdbf7ecbffaa2fe4c1462af8b6
          path: .tmp/tmpose-kamishibai
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .tmp/tmpose-kamishibai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: .tmp/tmpose-kamishibai
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:web
      - run: pnpm verify
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
